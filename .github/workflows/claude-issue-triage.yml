name: Claude Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (título y cuerpo obtenidos vía `gh issue view`).

            1. Asigna los labels apropiados con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               Labels existentes en el repo a considerar primero: bug, enhancement,
               documentation, duplicate, good first issue, help wanted, invalid,
               question, wontfix, accessibility.
               Si ninguno encaja bien, puedes crear un label nuevo relevante con
               `gh label create` y luego asignarlo.
            2. Publica un comentario en el issue (`gh issue comment ${{ github.event.issue.number }}`)
               con un diagnóstico general: qué está pidiendo/reportando el issue,
               en qué archivos del repo (index.html, style.css, game.js) probablemente
               haya que intervenir, y un posible enfoque de solución de alto nivel.
               No implementes la solución, solo diagnostica.
               El comentario debe estar escrito en formato Markdown compatible con GitHub
               (usa encabezados, listas, y bloques de código con \`\`\` para nombres de
               archivo o fragmentos de código cuando corresponda).
          claude_args: '--allowed-tools "Bash(gh issue *),Bash(gh label *)"'
